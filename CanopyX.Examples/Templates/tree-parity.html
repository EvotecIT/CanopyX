<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CanopyX tree grids</title><style>{{style}}</style><script>{{script}}</script>
<style>
body.tree-parity { margin:0; padding:16px; background:Canvas; color:CanvasText; font-family:system-ui,"Segoe UI",sans-serif; }
body.tree-parity[data-cx-theme="dark"] { color-scheme:dark; }
.tree-frame { margin:0 0 24px; max-width:100%; }
.tree-frame > .cx-host { height:420px; }
h1 { font-size:20px; margin:0 0 12px; } h2 { font-size:15px; margin:0 0 8px; }
</style>
<script>
// A dependency-free writer stands in for a host's Excel writer: it receives the tree rows with their level and id path.
window.treeExports = [];
CanopyX.registerExportFormat({ id: "xlsx", label: "Download Excel", extension: "xlsx",
  mime: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  async write(capture, { signal, progress }) {
    const rows = [];
    for await (const row of capture.rows({ signal })) {
      rows.push({ id: row.id, level: row.level, path: row.path, cells: Object.fromEntries(Object.entries(row.cells).map(([id, cell]) => [id, cell.text])) });
      if (rows.length % 100 === 0) progress(rows.length);
    }
    window.treeExports.push({ request: capture.request, rows });
    return new Blob([JSON.stringify(rows)], { type: "application/octet-stream" });
  } });
</script></head>
<body class="tree-parity" data-cx-theme="{{theme}}"><main>
<h1>Tree grids</h1>
<h2>Organisation chart</h2>
<div class="tree-frame">{{org}}</div>
<h2>File system with deep folders</h2>
<div class="tree-frame">{{files}}</div>
<h2>Groups with nesting</h2>
<div class="tree-frame">{{groups}}</div>
</main></body></html>
