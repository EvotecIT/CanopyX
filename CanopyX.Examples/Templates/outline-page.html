<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>CanopyX static outline in a themed page</title>
<link rel="stylesheet" href="bundle/assets/{{style}}">
</head>
<body class="cx-static" data-cx-theme="auto" style="margin:0;padding:24px 32px;font-family:var(--hfx-font-sans,'Segoe UI Variable Text','Segoe UI',Arial,sans-serif);color:var(--hfx-color-text,light-dark(#16181c,#f2f3f5));background:var(--hfx-color-surface,light-dark(#ffffff,#16181c));">
<main>
<h1 style="font-size:18px;margin:0 0 12px 0;">Static outline that follows the page theme</h1>
<!-- No script: the stylesheet gives .cx-static the light or dark palette, here by the reader's system preference. -->
<div class="cx-static" data-cx-theme="auto">
{{content}}
</div>
</main>
</body>
</html>
