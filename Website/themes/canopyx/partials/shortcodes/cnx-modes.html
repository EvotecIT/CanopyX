{{~ ## The three delivery modes as one tab set: the call that writes each, and the files it wrote this build. ## ~}}
{{~ nl = "\n" ~}}
<div class="cnx-modes" data-cnx-tabs><div class="cnx-modes__tabs cnx-tabs" role="tablist" aria-label="Delivery mode">{{ for m in data.docs.modes }}<button type="button" role="tab" class="cnx-tab" id="cnx-mode-tab-{{ m.id }}" aria-controls="cnx-mode-{{ m.id }}" aria-selected="{{ if for.first }}true{{ else }}false{{ end }}" tabindex="{{ if for.first }}0{{ else }}-1{{ end }}">{{ m.title }} <small>{{ m.files }} {{ if m.files == "1" }}file{{ else }}files{{ end }}</small><span class="cnx-tab__sort" aria-hidden="true"></span></button>{{ end }}</div>{{ for m in data.docs.modes }}<div class="cnx-modes__panel" role="tabpanel" id="cnx-mode-{{ m.id }}" aria-labelledby="cnx-mode-tab-{{ m.id }}"{{ if !for.first }} hidden{{ end }}><p class="cnx-modes__body">{{ m.body }}</p><figure class="cnx-example cnx-example--static"><div class="cnx-codeblock cnx-example__code"><div class="cnx-codeblock__bar"><span class="cnx-codeblock__file">{{ m.file }}</span><span class="cnx-codeblock__lang">C#</span></div><pre><code class="language-{{ m.lang }}">{{ m.code | html.escape | string.replace nl "&#10;" }}</code></pre></div><div class="cnx-example__out"><div class="cnx-example__bar"><span class="cnx-example__tag">Writes</span><code class="cnx-example__label">{{ m.files }} {{ if m.files == "1" }}file{{ else }}files{{ end }}, {{ m.size }}</code><span class="cnx-example__meta">Measured in this build</span></div><div class="cnx-example__body cnx-example__body--layout">{{ include m.partial }}</div></div></figure></div>{{ end }}</div>
