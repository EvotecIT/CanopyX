name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    name: Build, test, examples, browser tests, pack (${{ matrix.name }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: '["self-hosted","Linux","X64","root"]'
            browsers: chromium,firefox,webkit
          - name: Windows
            runner: '["self-hosted","Windows","X64"]'
            browsers: chromium,firefox
          - name: macOS
            runner: '["self-hosted","macOS","ARM64"]'
            browsers: chromium,webkit
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      CANOPYX_TEST_BROWSERS: ${{ matrix.browsers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # Five test packages install in seconds; transferring the runner's shared npm cache can exhaust this job.
          package-manager-cache: false

      - name: Install browser test dependencies
        working-directory: tests/browser
        shell: pwsh
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $engines = @($env:CANOPYX_TEST_BROWSERS -split ',')
          dotnet run --project ../BrowserInstall/BrowserInstall.csproj -c Release -- @engines
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run quality loop
        shell: pwsh
        run: ./Build.ps1 -Configuration Release -BrowserTestTimeoutSeconds 2400

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: canopyx-packages-${{ matrix.name }}
          path: |
            artifacts/packages/Release/*.nupkg
            artifacts/packages/Release/*.snupkg
          if-no-files-found: error

      - name: Upload example pages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canopyx-examples-${{ matrix.name }}
          path: |
            CanopyX.Examples/bin/Release/net10.0/output/inline.html
            CanopyX.Examples/bin/Release/net10.0/output/outline.html
          if-no-files-found: warn

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: canopyx-playwright-report-${{ matrix.name }}
          path: |
            tests/browser/playwright-report
            tests/browser/test-results
          if-no-files-found: ignore
