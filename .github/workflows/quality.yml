name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    name: Build, test, examples, browser tests, pack (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: Windows
            runner: windows-latest
          - name: macOS
            runner: macos-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install browser test dependencies
        working-directory: tests/browser
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          if [ "$RUNNER_OS" = "Linux" ]; then
            node node_modules/@playwright/test/cli.js install --with-deps chromium
          else
            node node_modules/@playwright/test/cli.js install chromium
          fi

      - name: Run quality loop
        shell: pwsh
        run: ./Build.ps1 -Configuration Release

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: canopyx-packages-${{ matrix.runner }}
          path: |
            artifacts/packages/Release/*.nupkg
            artifacts/packages/Release/*.snupkg
          if-no-files-found: error

      - name: Upload example pages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canopyx-examples-${{ matrix.runner }}
          path: |
            CanopyX.Examples/bin/Release/net10.0/output/inline.html
            CanopyX.Examples/bin/Release/net10.0/output/outline.html
          if-no-files-found: warn

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: canopyx-playwright-report-${{ matrix.runner }}
          path: |
            tests/browser/playwright-report
            tests/browser/test-results
          if-no-files-found: ignore
