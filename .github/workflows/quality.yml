name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      matrix_diagnostics:
        description: Run only the focused native macOS 15 WebKit matrix paint diagnostic
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  platform-gates:
    # Preserve the required platform contexts while requiring the entire browser/platform matrix to succeed.
    name: Build, test, examples, browser tests, pack (${{ matrix.platform }})
    needs: build-test-pack
    if: ${{ always() && !inputs.matrix_diagnostics }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        platform: [Linux, Windows, macOS]
    steps:
      - name: Require all platform and engine checks
        shell: pwsh
        env:
          MATRIX_RESULT: ${{ needs.build-test-pack.result }}
        run: |
          if ($env:MATRIX_RESULT -ne 'success') { throw "The browser/platform matrix did not pass: $env:MATRIX_RESULT" }

  build-test-pack:
    if: ${{ !inputs.matrix_diagnostics }}
    # Every platform runs the full browser suite in all three engines. Windows Firefox uses two isolated shards;
    # its serial suite outgrew the process deadline. Every shard keeps one worker and the same test/time limits.
    # The Chromium job of each platform
    # also packs; the Windows Chromium job also checks the visual baselines (tests/browser/playwright.config.mjs).
    name: Build, test, examples, browser tests, pack (${{ matrix.platform.name }}, ${{ matrix.engine }}${{ matrix.shard && format(', shard {0}/2', matrix.shard) || '' }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 135
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux
            runner: ubuntu-24.04
          - name: Windows
            runner: windows-2025
          - name: macOS
            runner: macos-15
        engine: [chromium, firefox, webkit]
        exclude:
          - platform:
              name: Windows
              runner: windows-2025
            engine: firefox
        include:
          - platform:
              name: Windows
              runner: windows-2025
            engine: firefox
            shard: 1
          - platform:
              name: Windows
              runner: windows-2025
            engine: firefox
            shard: 2
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      CANOPYX_TEST_BROWSERS: ${{ matrix.engine }}
      CANOPYX_TEST_SHARD: ${{ matrix.shard && format('{0}/2', matrix.shard) || '' }}
      CANOPYX_BENCHMARKS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # The small test dependency set does not need a restored npm cache.
          package-manager-cache: false

      - name: Install browser test dependencies
        working-directory: tests/browser
        shell: pwsh
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
          # Hosted Linux jobs are non-root; let HtmlTinkerX install the selected browser's OS prerequisites.
          HTMLTINKERX_PLAYWRIGHT_WITH_DEPS: "1"
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project ../BrowserInstall/BrowserInstall.csproj -c Release -- $env:CANOPYX_TEST_BROWSERS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run quality loop
        shell: pwsh
        run: |
          # Each engine/shard runs with one worker. This deadline catches a stalled suite.
          # Performance measurements run only by explicit opt-in.
          $seconds = 7200
          if ($env:CANOPYX_TEST_BROWSERS -eq 'chromium') {
            ./Build.ps1 -Configuration Release -BrowserTestTimeoutSeconds $seconds
          } else {
            ./Build.ps1 -Configuration Release -BrowserTestTimeoutSeconds $seconds -SkipPack
          }

      - name: Upload packages
        if: matrix.engine == 'chromium'
        uses: actions/upload-artifact@v7
        with:
          name: canopyx-packages-${{ matrix.platform.name }}
          path: |
            artifacts/packages/Release/*.nupkg
            artifacts/packages/Release/*.snupkg
          if-no-files-found: error

      - name: Upload example pages
        if: always() && matrix.engine == 'chromium'
        uses: actions/upload-artifact@v7
        with:
          name: canopyx-examples-${{ matrix.platform.name }}
          path: |
            CanopyX.Examples/bin/Release/net10.0/output/inline.html
            CanopyX.Examples/bin/Release/net10.0/output/outline.html
          if-no-files-found: warn

      # On failure the report holds the traces, and for the visual baselines the expected, actual and diff images.
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: canopyx-playwright-report-${{ matrix.platform.name }}-${{ matrix.engine }}-${{ matrix.shard || 'full' }}
          path: |
            tests/browser/playwright-report
            tests/browser/test-results
          if-no-files-found: ignore

  matrix-native-diagnostic:
    name: Matrix paint diagnostic (macOS 15 arm64, WebKit)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.matrix_diagnostics }}
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      MSBUILDDISABLENODEREUSE: "1"
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
      CANOPYX_TEST_BROWSERS: webkit
      CANOPYX_VISUAL: "0"
      SOURCE_COMMIT: 586926544708d48882453f47d5581f178545573a
    steps:
      - name: Checkout exact diagnostic candidate and source history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Record and require the native environment
        shell: bash
        run: |
          mkdir -p artifacts/matrix-diagnostics/baseline-assets
          { sw_vers; uname -m; node --version; dotnet --info; git rev-parse HEAD; } > artifacts/matrix-diagnostics/environment.txt
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 15
          for asset in canopyx-grid.css canopyx-matrix.css canopyx-grid.js canopyx-matrix.js; do
            git show "$SOURCE_COMMIT:CanopyX.Html/Assets/$asset" > "artifacts/matrix-diagnostics/baseline-assets/$asset"
          done

      - name: Install pinned WebKit through HtmlTinkerX
        id: install
        working-directory: tests/browser
        shell: pwsh
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project ../BrowserInstall/BrowserInstall.csproj -c Release -- webkit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The original failure immediately followed these ten lifecycle cases. Keep that order in one worker
      # to test whether their create/destroy history matters; the first diagnostic used fresh isolated workers.
      # Baseline failures are expected diagnostic evidence, never a substitute for a passing candidate.
      - name: Record original-source first paint after its lifecycle cohort
        id: baseline
        continue-on-error: true
        working-directory: tests/browser
        shell: bash
        env:
          CANOPYX_MATRIX_DIAGNOSTICS: passive
          CANOPYX_MATRIX_ASSETS: ${{ github.workspace }}/artifacts/matrix-diagnostics/baseline-assets
        run: |
          node node_modules/@playwright/test/cli.js test specs/matrix-lifecycle.spec.mjs specs/matrix.spec.mjs --project=webkit --grep 'queued matrix|matrix destroy|a matrix draws its cells' --repeat-each=3 --workers=1 --retries=0 --reporter=list --trace=on --output="$GITHUB_WORKSPACE/artifacts/matrix-diagnostics/baseline"

      - name: Check candidate first paint and theme after the same cohort
        id: candidate
        working-directory: tests/browser
        shell: bash
        env:
          CANOPYX_MATRIX_DIAGNOSTICS: passive
        run: |
          node node_modules/@playwright/test/cli.js test specs/matrix-lifecycle.spec.mjs specs/matrix.spec.mjs --project=webkit --grep 'queued matrix|matrix destroy|a matrix draws its cells|a theme switch draws' --repeat-each=3 --workers=1 --retries=0 --reporter=list --trace=on --output="$GITHUB_WORKSPACE/artifacts/matrix-diagnostics/candidate"

      - name: Capture one separate candidate draw-call trace
        id: calls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: tests/browser
        shell: bash
        env:
          CANOPYX_MATRIX_DIAGNOSTICS: calls
        run: |
          node node_modules/@playwright/test/cli.js test specs/matrix.spec.mjs --project=webkit --grep 'a matrix draws its cells' --workers=1 --retries=0 --reporter=list --trace=on --output="$GITHUB_WORKSPACE/artifacts/matrix-diagnostics/calls"

      - name: Record exact candidate and diagnostic outcomes
        if: always()
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          CALLS_OUTCOME: ${{ steps.calls.outcome }}
        run: |
          mkdir -p artifacts/matrix-diagnostics
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const record = { workflowSha: process.env.WORKFLOW_SHA, checkoutSha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), sourceSha: process.env.SOURCE_COMMIT, node: process.version, arch: process.arch, baseline: process.env.BASELINE_OUTCOME, candidate: process.env.CANDIDATE_OUTCOME, calls: process.env.CALLS_OUTCOME };
          fs.writeFileSync('artifacts/matrix-diagnostics/run.json', JSON.stringify(record, null, 2));
          JS

      - name: Upload bounded matrix diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matrix-native-mac15-${{ github.sha }}
          path: artifacts/matrix-diagnostics
          if-no-files-found: error
          retention-days: 7
