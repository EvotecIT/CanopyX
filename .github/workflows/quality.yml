name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-gates:
    # Preserve the required platform contexts while requiring the entire browser/platform matrix to succeed.
    name: Build, test, examples, browser tests, pack (${{ matrix.platform }})
    needs: build-test-pack
    if: always()
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        platform: [Linux, Windows, macOS]
    steps:
      - name: Require all platform and engine checks
        shell: pwsh
        env:
          MATRIX_RESULT: ${{ needs.build-test-pack.result }}
        run: |
          if ($env:MATRIX_RESULT -ne 'success') { throw "The browser/platform matrix did not pass: $env:MATRIX_RESULT" }

  build-test-pack:
    # Every platform runs the full browser suite in all three engines. Windows Firefox uses two isolated shards;
    # its serial suite outgrew the process deadline. Every shard keeps one worker and the same test/time limits.
    # The Chromium job of each platform
    # also packs; the Windows Chromium job also checks the visual baselines (tests/browser/playwright.config.mjs).
    name: Build, test, examples, browser tests, pack (${{ matrix.platform.name }}, ${{ matrix.engine }}${{ matrix.shard && format(', shard {0}/2', matrix.shard) || '' }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 135
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux
            runner: ubuntu-24.04
          - name: Windows
            runner: windows-2025
          - name: macOS
            runner: macos-15
        engine: [chromium, firefox, webkit]
        exclude:
          - platform:
              name: Windows
              runner: windows-2025
            engine: firefox
        include:
          - platform:
              name: Windows
              runner: windows-2025
            engine: firefox
            shard: 1
          - platform:
              name: Windows
              runner: windows-2025
            engine: firefox
            shard: 2
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      CANOPYX_TEST_BROWSERS: ${{ matrix.engine }}
      CANOPYX_TEST_SHARD: ${{ matrix.shard && format('{0}/2', matrix.shard) || '' }}
      CANOPYX_BENCHMARKS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # The small test dependency set does not need a restored npm cache.
          package-manager-cache: false

      - name: Install browser test dependencies
        working-directory: tests/browser
        shell: pwsh
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
          # Hosted Linux jobs are non-root; let HtmlTinkerX install the selected browser's OS prerequisites.
          HTMLTINKERX_PLAYWRIGHT_WITH_DEPS: "1"
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project ../BrowserInstall/BrowserInstall.csproj -c Release -- $env:CANOPYX_TEST_BROWSERS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run quality loop
        shell: pwsh
        run: |
          # Each engine/shard runs with one worker. This deadline catches a stalled suite.
          # Performance measurements run only by explicit opt-in.
          $seconds = 7200
          if ($env:CANOPYX_TEST_BROWSERS -eq 'chromium') {
            ./Build.ps1 -Configuration Release -BrowserTestTimeoutSeconds $seconds
          } else {
            ./Build.ps1 -Configuration Release -BrowserTestTimeoutSeconds $seconds -SkipPack
          }

      - name: Upload packages
        if: matrix.engine == 'chromium'
        uses: actions/upload-artifact@v7
        with:
          name: canopyx-packages-${{ matrix.platform.name }}
          path: |
            artifacts/packages/Release/*.nupkg
            artifacts/packages/Release/*.snupkg
          if-no-files-found: error

      - name: Upload example pages
        if: always() && matrix.engine == 'chromium'
        uses: actions/upload-artifact@v7
        with:
          name: canopyx-examples-${{ matrix.platform.name }}
          path: |
            CanopyX.Examples/bin/Release/net10.0/output/inline.html
            CanopyX.Examples/bin/Release/net10.0/output/outline.html
          if-no-files-found: warn

      # On failure the report holds the traces, and for the visual baselines the expected, actual and diff images.
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: canopyx-playwright-report-${{ matrix.platform.name }}-${{ matrix.engine }}-${{ matrix.shard || 'full' }}
          path: |
            tests/browser/playwright-report
            tests/browser/test-results
          if-no-files-found: ignore
