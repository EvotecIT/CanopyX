name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A unique group for every non-PR run also protects queued main pushes from replacement.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Select Quality coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout complete PR history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check coverage selection
        run: node --test .github/scripts/quality-plan.test.mjs tests/browser/tools/shards.test.mjs
      - name: Detect changed paths and select matrix
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/quality-plan.mjs

  platform-gates:
    # Preserve required contexts, including an explicitly selected documentation-only skip.
    name: Build, test, examples, browser tests, pack (${{ matrix.platform }})
    needs: [changes, build-test-pack, browser-coverage]
    if: always()
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        platform: [Linux, Windows, macOS]
    steps:
      - name: Require all platform and engine checks
        shell: pwsh
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build }}
          MATRIX_RESULT: ${{ needs.build-test-pack.result }}
          COVERAGE_RESULT: ${{ needs.browser-coverage.result }}
        run: |
          if ($env:CHANGES_RESULT -ne 'success') { throw "Coverage selection did not pass: $env:CHANGES_RESULT" }
          if ($env:BUILD_REQUIRED -eq 'false' -and $env:MATRIX_RESULT -eq 'skipped') {
            Write-Host 'Documentation/Website-only PR; browser/platform matrix is not required.'
            exit 0
          }
          if ($env:MATRIX_RESULT -ne 'success') { throw "The browser/platform matrix did not pass: $env:MATRIX_RESULT" }
          if ($env:COVERAGE_RESULT -ne 'success') { throw "Browser shard coverage did not pass: $env:COVERAGE_RESULT" }

  build-test-pack:
    # Main pushes and manual runs keep the full matrix. PRs that touch the browser runtime or shared build inputs cover
    # all Linux engines, Windows Chromium and macOS WebKit; other code PRs cover Chromium on Linux and Windows
    # (.github/scripts/quality-plan.mjs). Every lane runs in shards. The first job of each platform also runs the .NET
    # suites and engine-independent checks, the first Chromium job of each platform also packs, and the Windows
    # Chromium shards also check the visual baselines (tests/browser/playwright.config.mjs).
    name: Build, test, examples, browser tests, pack (${{ matrix.platform.name }}, ${{ matrix.engine }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      CANOPYX_TEST_BROWSERS: ${{ matrix.engine }}
      CANOPYX_TEST_SHARD: ${{ format('{0}/{1}', matrix.shard, matrix.shards) }}
      CANOPYX_SUITES: ${{ matrix.suites && '1' || '0' }}
      CANOPYX_PACK: ${{ matrix.pack && '1' || '0' }}
      CANOPYX_TEST_WORKERS: "3"
      CANOPYX_BENCHMARKS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Hosted Windows runners keep the default NuGet cache on the slower C: drive.
      - name: Use the runner temp drive for NuGet
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          "NUGET_PACKAGES=$env:RUNNER_TEMP\nuget\packages" >> $env:GITHUB_ENV
          "NUGET_HTTP_CACHE_PATH=$env:RUNNER_TEMP\nuget\http-cache" >> $env:GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # The small test dependency set does not need a restored npm cache.
          package-manager-cache: false

      # Linux installs the browser's OS packages through apt, and the Azure mirror sometimes crawls through those
      # downloads for most of an hour (8.5, 15, 31 and 52 minutes in recent runs). Keep the downloaded packages in a
      # cache per engine and runner image so later jobs install them without the mirror.
      - name: Keep apt packages for the browser cache
        id: apt
        if: runner.os == 'Linux'
        run: |
          # The runner image's zz-retries file sets one retry; a later file name wins.
          mkdir -p "$HOME/apt-archives/partial"
          printf '%s\n' "Dir::Cache::Archives \"$HOME/apt-archives/\";" 'APT::Keep-Downloaded-Packages "true";' \
            'Acquire::Retries "5";' 'Acquire::http::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/zzz-canopyx-ci
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore browser apt packages
        id: apt-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives/*.deb
          key: browser-apt-${{ matrix.engine }}-${{ steps.apt.outputs.image }}-${{ hashFiles('tests/browser/package-lock.json') }}
          restore-keys: browser-apt-${{ matrix.engine }}-

      - name: Install browser test dependencies
        timeout-minutes: 20
        working-directory: tests/browser
        shell: pwsh
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
          # Hosted Linux jobs are non-root; let HtmlTinkerX install the selected browser's OS prerequisites.
          HTMLTINKERX_PLAYWRIGHT_WITH_DEPS: "1"
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project ../BrowserInstall/BrowserInstall.csproj -c Release -- $env:CANOPYX_TEST_BROWSERS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save browser apt packages
        if: runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - name: Run quality loop
        shell: pwsh
        run: |
          # Files run on three workers; tests within each file retain their execution order.
          # A shard's browser tests take about a quarter of an hour; the deadline catches a stalled suite.
          # Performance measurements run only by explicit opt-in.
          $options = @{ Configuration = 'Release'; BrowserTestTimeoutSeconds = 2700 }
          if ($env:CANOPYX_SUITES -ne '1') { $options.SkipTests = $true }
          if ($env:CANOPYX_PACK -ne '1') { $options.SkipPack = $true }
          ./Build.ps1 @options

      - name: Upload packages
        if: matrix.pack
        uses: actions/upload-artifact@v7
        with:
          name: canopyx-packages-${{ matrix.platform.name }}
          path: |
            artifacts/packages/Release/*.nupkg
            artifacts/packages/Release/*.snupkg
          if-no-files-found: error

      - name: Upload example pages
        if: always() && matrix.pack
        uses: actions/upload-artifact@v7
        with:
          name: canopyx-examples-${{ matrix.platform.name }}
          path: |
            CanopyX.Examples/bin/Release/net10.0/output/inline.html
            CanopyX.Examples/bin/Release/net10.0/output/outline.html
          if-no-files-found: warn

      # The coverage job checks that the shards of each lane ran every listed test exactly once.
      - name: Upload browser shard record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canopyx-browser-shard-${{ matrix.platform.name }}-${{ matrix.engine }}-${{ matrix.shard }}
          path: tests/browser/shard-results/shard.json
          if-no-files-found: ignore
          retention-days: 7

      # On failure the report holds the traces, and for the visual baselines the expected, actual and diff images.
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: canopyx-playwright-report-${{ matrix.platform.name }}-${{ matrix.engine }}-${{ matrix.shard }}
          path: |
            tests/browser/playwright-report
            tests/browser/test-results
          if-no-files-found: ignore

  browser-coverage:
    name: Browser shard coverage
    needs: [changes, build-test-pack]
    if: always() && needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download shard records
        uses: actions/download-artifact@v8
        with:
          pattern: canopyx-browser-shard-*
          path: shard-records
      - name: Check that every listed test ran exactly once
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: node .github/scripts/browser-coverage.mjs shard-records
