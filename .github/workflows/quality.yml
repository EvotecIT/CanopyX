name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Full coverage on the default branch, away from the top-of-hour rush.
    - cron: '23 2 * * *'

# A unique group for every non-PR run also protects queued main pushes from replacement.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Select Quality coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout complete PR history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check coverage selection
        run: node --test .github/scripts/quality-plan.test.mjs
      - name: Detect changed paths and select matrix
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/quality-plan.mjs

  platform-gates:
    # Preserve required contexts, including an explicitly selected documentation-only skip.
    name: Build, test, examples, browser tests, pack (${{ matrix.platform }})
    needs: [changes, build-test-pack]
    if: always()
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        platform: [Linux, Windows, macOS]
    steps:
      - name: Require all platform and engine checks
        shell: pwsh
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build }}
          MATRIX_RESULT: ${{ needs.build-test-pack.result }}
        run: |
          if ($env:CHANGES_RESULT -ne 'success') { throw "Coverage selection did not pass: $env:CHANGES_RESULT" }
          if ($env:BUILD_REQUIRED -eq 'false' -and $env:MATRIX_RESULT -eq 'skipped') {
            Write-Host 'Documentation/Website-only PR; browser/platform matrix is not required.'
            exit 0
          }
          if ($env:MATRIX_RESULT -ne 'success') { throw "The browser/platform matrix did not pass: $env:MATRIX_RESULT" }

  build-test-pack:
    # PRs cover all Linux engines, Windows Chromium and macOS WebKit; main/manual/nightly keep the full matrix.
    # The Chromium job of each selected platform
    # also packs; the Windows Chromium job also checks the visual baselines (tests/browser/playwright.config.mjs).
    name: Build, test, examples, browser tests, pack (${{ matrix.platform.name }}, ${{ matrix.engine }}${{ matrix.shard && format(', shard {0}/2', matrix.shard) || '' }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 135
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      CANOPYX_TEST_BROWSERS: ${{ matrix.engine }}
      CANOPYX_TEST_SHARD: ${{ matrix.shard && format('{0}/2', matrix.shard) || '' }}
      CANOPYX_TEST_WORKERS: "3"
      CANOPYX_BENCHMARKS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Use the published SDK directly; the channel redirect currently returns HTTP 409.
          dotnet-version: 10.0.403

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # The small test dependency set does not need a restored npm cache.
          package-manager-cache: false

      - name: Install browser test dependencies
        working-directory: tests/browser
        shell: pwsh
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
          # Hosted Linux jobs are non-root; let HtmlTinkerX install the selected browser's OS prerequisites.
          HTMLTINKERX_PLAYWRIGHT_WITH_DEPS: "1"
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project ../BrowserInstall/BrowserInstall.csproj -c Release -- $env:CANOPYX_TEST_BROWSERS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run quality loop
        shell: pwsh
        run: |
          # Files run on three workers; tests within each file retain their execution order.
          # Keep the existing deadline to catch a stalled suite.
          # Performance measurements run only by explicit opt-in.
          $seconds = 7200
          if ($env:CANOPYX_TEST_BROWSERS -eq 'chromium') {
            ./Build.ps1 -Configuration Release -BrowserTestTimeoutSeconds $seconds
          } else {
            ./Build.ps1 -Configuration Release -BrowserTestTimeoutSeconds $seconds -SkipPack
          }

      - name: Upload packages
        if: matrix.engine == 'chromium'
        uses: actions/upload-artifact@v7
        with:
          name: canopyx-packages-${{ matrix.platform.name }}
          path: |
            artifacts/packages/Release/*.nupkg
            artifacts/packages/Release/*.snupkg
          if-no-files-found: error

      - name: Upload example pages
        if: always() && matrix.engine == 'chromium'
        uses: actions/upload-artifact@v7
        with:
          name: canopyx-examples-${{ matrix.platform.name }}
          path: |
            CanopyX.Examples/bin/Release/net10.0/output/inline.html
            CanopyX.Examples/bin/Release/net10.0/output/outline.html
          if-no-files-found: warn

      # On failure the report holds the traces, and for the visual baselines the expected, actual and diff images.
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: canopyx-playwright-report-${{ matrix.platform.name }}-${{ matrix.engine }}-${{ matrix.shard || 'full' }}
          path: |
            tests/browser/playwright-report
            tests/browser/test-results
          if-no-files-found: ignore
