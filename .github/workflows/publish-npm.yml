name: Publish npm package

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Optional exact npm version; blank selects the next patch automatically.
        required: false
        type: string
      quality-run-id:
        description: Successful main-branch Quality run for this exact commit.
        required: false
        type: string
      publish:
        description: Publish the qualified archive; false performs a dry run.
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: canopyx-npm-release
  cancel-in-progress: false
  queue: max

jobs:
  version:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should-release: ${{ steps.version.outputs.should-release }}
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - id: version
        uses: EvotecIT/PSPublishModule/.github/actions/npm-release-version@f8fa8e1a33d06ed2d024403de4fc6738d7736e3a
        with:
          version: ${{ inputs.version }}
          quality-run-id: ${{ github.event.workflow_run.id || inputs.quality-run-id }}
          reserve: ${{ github.event_name == 'workflow_run' || inputs.publish }}

  package:
    needs: version
    if: needs.version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.archive.outputs.sha256 }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build and qualify the product packages
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./Build/Sync-Assets.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./Build.ps1 -Configuration Release -SkipBrowserTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set the reserved npm release version
        shell: pwsh
        run: |
          & npm version $env:RELEASE_VERSION --no-git-tag-version --ignore-scripts --allow-same-version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot set the npm release version.' }
          $readme = [IO.File]::ReadAllText('README.md')
          $prefix = 'https://cdn.jsdelivr.net/npm/@evotecit/canopyx@'
          $pattern = [regex]::Escape($prefix) + '\d+\.\d+\.\d+(?=/docs/images/)'
          [IO.File]::WriteAllText('README.md', [regex]::Replace($readme, $pattern, $prefix + $env:RELEASE_VERSION))
      - name: Qualify the JavaScript package consumer
        working-directory: tests/browser
        run: npm ci --no-audit --no-fund && npm run test:distribution
      - name: Pack the qualified archive
        id: archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          if ($metadata.version -cne $env:RELEASE_VERSION) { throw 'Requested version differs from the qualified product.' }
          $output = Join-Path $env:RUNNER_TEMP 'canopyx-npm'
          New-Item -ItemType Directory -Path $output | Out-Null
          $packJson = & npm pack --ignore-scripts --json --pack-destination $output
          if ($LASTEXITCODE -ne 0) { throw 'npm pack failed.' }
          $packed = @($packJson | ConvertFrom-Json)
          if ($packed.Count -ne 1) { throw 'Expected one CanopyX package.' }
          $sha256 = (Get-FileHash -LiteralPath (Join-Path $output $packed[0].filename) -Algorithm SHA256).Hash
          "sha256=$sha256" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canopyx-npm
          path: ${{ runner.temp }}/canopyx-npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, package]
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-npm-publish.yml@f8fa8e1a33d06ed2d024403de4fc6738d7736e3a
    with:
      artifact-name: canopyx-npm
      package-name: '@evotecit/canopyx'
      version: ${{ needs.version.outputs.version }}
      sha256: ${{ needs.package.outputs.sha256 }}
      quality-run-id: ${{ github.event.workflow_run.id || inputs.quality-run-id }}
      environment-name: npm-release
      publish: ${{ github.event_name == 'workflow_run' || inputs.publish }}
      bootstrap: false
    secrets:
      NPM_BOOTSTRAP_TOKEN: ''

  release:
    needs: [version, publish]
    if: github.event_name == 'workflow_run' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Record the verified npm release
        shell: pwsh
        run: |
          & gh release view $env:RELEASE_TAG
          if ($LASTEXITCODE -eq 0) { exit 0 }
          & gh release create $env:RELEASE_TAG --title "npm $env:RELEASE_VERSION" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'npm is published, but the GitHub release record needs reconciliation. Do not upload again.' }
