version: 2
updates:
- package-ecosystem: nuget
  directory: /
  # Update HtmlTinkerX and the Node Playwright runner together.
  ignore:
  - dependency-name: "HtmlTinkerX"
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
    - version-update:semver-patch
  schedule:
    interval: daily
  cooldown:
    default-days: 7
    include:
    - '*'
  open-pull-requests-limit: 1
  groups:
    all-dependencies:
      patterns:
      - '*'
- package-ecosystem: npm
  directory: /tests/browser
  # Match the Playwright runtime installed by HtmlTinkerX.
  ignore:
  - dependency-name: "@playwright/test"
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
    - version-update:semver-patch
  schedule:
    interval: daily
  cooldown:
    default-days: 7
    include:
    - '*'
  open-pull-requests-limit: 1
  groups:
    all-dependencies:
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  cooldown:
    default-days: 7
    include:
    - '*'
  open-pull-requests-limit: 1
  groups:
    all-dependencies:
      patterns:
      - '*'
